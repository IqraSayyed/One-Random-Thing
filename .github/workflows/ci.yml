name: HTML Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .